<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>login iostream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!--header starts-->
	<div th:replace="~{fragments/header :: crm-header}"></div>
    <!--header ends-->

    <!--main content starts-->

    <main class="container-fluid" style="min-height:550px;">


        <!--content-->
        <section class="container py-5 bg-light">

            <h3 class="text-center mb-4"> Login Here </h3>

            <!--courses-->
            <div class="row justify-content-center">

                <!--login card starts-->
                <div class="col-lg-4 col-md-6 ms-3">
                    <div class="card p-5 shadow" >
                        <form action="/loginForm" method="post">
                            <div class="mb-3">
								<div th:if="${errorMsg}" class="mb-3 alert alert-danger" role="alert">
									<span th:text="${errorMsg}"></span>
								</div>
                                <label for="exampleInputEmail1" class="form-label">Email address</label>
                                <input type="email" class="form-control" name="email"/>
                                   
                                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label">Password</label>
                                <input type="password" class="form-control" name="password"/>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Login</button>
                        </form>
                    </div>
                </div>
                <!--login card ends-->





            </div>
        </section>

    </main>

    <!--main content ends-->



    <!--footer starts-->
   <div th:replace="~{fragments/footer :: crm-footer}"></div>
    <!--footer ends-->


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
