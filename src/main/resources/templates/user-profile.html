<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Profile Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">



</head>

<body>
    <!--header starts-->
	<div th:replace="~{fragments/user-header :: crm-userheader}"></div>
    <!--header ends-->

    <!--main content starts-->

    <main class="container-fluid" style="min-height: 450px;">


        <!--content-->
        <section class="container py-5 ">

           
            <div class="row">
                <div class="col-lg-4">
                    <div class="card shadow" style="width: 18rem;">
                        <div class="card-body">
                            <div class="text-center">
                                <i class="bi bi-person-circle" style="font-size: 8rem;"></i>
                                <h3 th:text="${sessionUser.name}"></h3>

                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card shadow" >
                        <div class="card-body">
                            <div class="text-center">
                                <h3 class="mb-4">User Details</h3>
                                <table class="table table-striped  table-bordered">

                                    <tbody>
                                        <tr>

                                            <td>Name</td>
                                            <td th:text="${sessionUser.name}"></td>

                                        </tr>
                                        <tr>

                                            <td>Email</td>
                                            <td th:text="${sessionUser.email}"></td>

                                        </tr>

                                        <tr>

                                            <td>Phone No</td>
                                            <td th:text="${sessionUser.phoneno}"></td>

                                        </tr>

                                        <tr>

                                            <td>City</td>
                                            <td th:text="${sessionUser.city}"></td>

                                        </tr>

                                    </tbody>
                                </table>

                            </div>
                        </div>
                    </div>
                </div>
            </div>




        </section>

    </main>

    <!--main content ends-->



    <!--footer starts-->
	<div th:replace="~{fragments/footer :: crm-footer}"></div>
    <!--footer ends-->


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
