<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header th:fragment="crm-userheader">
        <nav class="navbar navbar-expand-lg" style="background-color: #26086d;">
            <div class="container text-white">
                <a class="navbar-brand" href="/index">
                    <img src="images/logo.png" alt="iostream programming logo" width="60" />
                    <span class="h3 ms-2">iostream</span>
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 me-4">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="/index">Home</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav mb-2 mb-lg-0 me-4">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="/my-enrollments">My-Courses</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav mb-2 mb-lg-0 me-4">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="/user-profile">
                                <i class="bi bi-person-check-fill me-2" style="font-size: 1.2rem;"></i>
                                Hello, <span th:text="${sessionUser.name}"></span>
                            </a>
                        </li>
                    </ul>
                    
                    <a href="/logout" class="btn btn-outline-danger"> Logout </a>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
